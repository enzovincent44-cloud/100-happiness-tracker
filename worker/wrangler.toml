name = "happiness-tracker-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Le plan gratuit de Cloudflare Workers suffit largement
# (100 000 requêtes/jour).

[vars]
# Optionnel : restreint le proxy à ton site GitHub Pages.
# Laisse vide ou supprime la ligne pour autoriser tout le monde.
ALLOWED_ORIGIN = "https://TON-PSEUDO.github.io"

# La clé API-Football ne va PAS ici (fichier versionné dans git).
# Configure-la comme secret avec :
#   wrangler secret put API_FOOTBALL_KEY
